<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>简历工作台 · Resume Studio</title><link rel="stylesheet" href="app/style.css"><link rel="stylesheet" href="app/resume.css"></head>
<body><div id="app"><header class="app-header"><div class="brand"><span class="brand-mark">履</span><div><strong>简历工作台</strong><small>RESUME STUDIO</small></div><span class="version">2.1</span></div><div class="header-actions"><span id="save-status" role="status">本地保存</span><button data-action="import">导入材料</button><button data-action="settings">AI 设置</button><button data-action="export" class="primary">导出简历 ↗</button></div></header>
<main class="workspace"><aside class="library"><div class="library-heading"><span>我的简历</span><button data-action="new" aria-label="新建简历">＋</button></div><label class="search"><input id="resume-search" aria-label="搜索简历" placeholder="搜索姓名、客户或岗位"></label><div id="resume-list" class="resume-list"></div><div class="library-footer"><button data-action="backup">备份全部简历</button><button data-action="restore-backup">恢复备份</button><p>资料留在本机<br>AI 功能按需联网</p></div></aside>
<section class="editor"><div class="editor-heading"><div><small>正在编辑</small><input id="resume-title" aria-label="简历名称" maxlength="100"></div><button data-action="record-menu" class="more" aria-label="简历管理">···</button></div><nav class="editor-tabs" aria-label="编辑分类"><button data-tab="content" class="active">内容</button><button data-tab="quality">质量检查 <span id="issue-count"></span></button><button data-tab="layout">排版</button><button data-tab="client">客户交付</button><button data-action="open-job-matcher">找匹配岗位</button></nav><div id="editor-content" class="editor-content"></div></section>
<section class="preview-pane"><div class="preview-toolbar"><div><strong>实时预览</strong><span id="template-name">经典商务</span></div><div><button data-action="zoom-out" aria-label="缩小预览">−</button><span id="zoom-label">75%</span><button data-action="zoom-in" aria-label="放大预览">＋</button><button data-action="history">历史版本</button></div></div><div id="quality-strip" class="quality-strip"></div><div class="paper-scroll"><div class="paper-stage" id="paper-stage"><div class="paper-scale" id="paper-scale"><article id="resume-sheet" class="resume-sheet" aria-label="简历预览"></article></div></div><div class="preview-caption" id="preview-caption"></div></div></section></main></div>
<div id="modal-root"></div><div id="toast" class="toast" role="status" hidden></div><input type="file" id="backup-file" accept="application/json,.json" hidden>
<script src="vendor/pdf.min.js"></script><script src="vendor/mammoth.js"></script><script src="vendor/docx.js"></script><script src="vendor/html2canvas.js"></script><script src="app/jobs.js"></script><script src="app/core.js"></script><script src="app/render.js"></script><script src="app/services.js"></script><script src="app/ai.js"></script><script src="app/client-report.js"></script><script src="app/app.js"></script></body></html>
